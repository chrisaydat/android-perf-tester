<!--
Android Perf Tester v2 renders reports from src/report_generator.py.
This template file is intentionally lightweight so package users can copy it
as a starting point for custom report branding.
-->
<main class="shell">
  <header class="hero">
    <p class="eyebrow">Android Perf Tester v2</p>
    <h1>{{ package_name }} / {{ scenario }}</h1>
  </header>
  <section>
    <h2>Summary</h2>
    <p>{{ status }}</p>
  </section>
</main>
